name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      random-tag: ${{ steps.random-tag.outputs.random-tag }}
    steps:
      - uses: actions/checkout@v3

      - name: Generate Random Tag
        id: random-tag
        run: |
          tag=$(uuidgen | tr -dc A-Za-z0-9 | head -c 7)
          echo "random-tag=$tag" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the Docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/loonas-webapp:${{ steps.random-tag.outputs.random-tag }} .

      - name: Push the Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/loonas-webapp:${{ steps.random-tag.outputs.random-tag }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            docker login -u ${{ vars.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/loonas-webapp:${{ needs.build-and-push.outputs.random-tag  }}
            docker stop loonas_webapp || true  
            docker rm loonas_webapp || true   
            docker run -d --name loonas_webapp --network sancaka --env-file .loonas_webapp.env ${{ vars.DOCKERHUB_USERNAME }}/loonas-webapp:${{ needs.build-and-push.outputs.random-tag  }}